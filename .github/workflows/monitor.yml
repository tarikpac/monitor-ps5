name: Monitor de ofertas PS5

on:
  schedule:
    - cron: "*/5 * * * *"   # o mínimo do GitHub; em horário de pico ele pode atrasar
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

# Uma rodada por vez: duas ao mesmo tempo avisariam a mesma oferta duas vezes.
concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rodada:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # estado.json (o que já foi visto) passa de uma rodada para a outra pelo
      # cache: cada rodada restaura o mais recente e salva uma versão nova.
      - uses: actions/cache/restore@v6
        with:
          path: estado.json
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - run: python nuvem.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TZ: America/Sao_Paulo

      - uses: actions/cache/save@v6
        if: always()
        with:
          path: estado.json
          key: estado-${{ github.run_id }}
