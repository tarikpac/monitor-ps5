# Monitor de ofertas PS5 — configuração da versão GitHub Actions
# Sem senhas aqui: o token do bot e o seu id ficam nos Secrets do repositório.
# Depois de mudar algo, faça commit; a próxima rodada já usa a versão nova.

[nuvem]
# Canais públicos do Telegram lidos a cada rodada (o @ do canal, sem o @).
canais = [
  "ofertasadrenaline", "descontoemgamespsx", "ofertasplaystationbr",
  "c_cuponsepromocoesonline", "meups4", "ofertasportateis",
  "pelandobr", "descontomaior",
]

# Outros produtos, cada um com seus canais e seu filtro, separados do PS5.
# Os avisos chegam pelo mesmo bot, com o emoji e o modelo no título.
[[outros]]
nome = "Novablast"
emoji = "👟"
canais = ["teniscertocupons"]
# Bot próprio deste produto: nome da variável de ambiente com o token dele
# (no Render, em Environment). Sem ela, usa o bot do PS5.
bot = "BOT_TOKEN_TENIS"
# Precisa citar um destes (masculino e feminino entram os dois).
termos = ["novablast 5", "novablast 6"]
# Posts de resumo e ranking repetem ofertas que já foram avisadas.
termos_bloqueados = ["resumo das melhores", "top 10", "mais vendidos da semana"]
# Abaixo disso não é o tênis (meia, palmilha...). 0 = sem teto de preço.
preco_minimo = 150
preco_maximo = 0

[pelando]
# Também vigia o site pelando.com.br: a busca abaixo (a mesma do seu alerta)
# e a página de promoções recentes, a cada rodada. false = desliga.
# O site do Pelando recusa (403) os servidores do GitHub; no Render o
# servidor_web.py tenta e, se for recusado também, passa a tentar só de meia
# em meia hora. O canal @pelandobr acima é lido de qualquer jeito.
ativo = true
busca = "console playstation 5"

[filtro]
# Só avisa ofertas até este preço, em reais. 0 = avisa qualquer preço.
preco_maximo = 0

# Abaixo deste valor não é o console (é jogo, controle, assinatura...).
preco_minimo_console = 1500

# A mensagem precisa citar um destes. Maiúsculas e acentos não importam,
# e "ps 5" também acha "ps5".
termos_ps5 = ["ps 5", "playstation 5", "play 5"]

# Sinais de que é o console mesmo. Ganham dos termos de acessório abaixo.
termos_console = [
  "console", "slim", "ps5 pro", "playstation 5 pro", "bundle",
  "edicao digital", "digital edition", "versao digital",
  "leitor de disco", "com leitor",
]

# Acessórios que podem custar caro. Se aparecer um destes e nenhum termo de
# console, a mensagem é ignorada. Jogos e controles comuns já são barrados
# pelo preco_minimo_console.
termos_acessorio = [
  "ssd", "hd externo", "volante", "headset", "fone", "pulse", "monitor",
  "cadeira", "capa", "skin", "adesivo", "suporte", "cooler", "dock",
  "base de carregamento", "carregador", "cabo", "dualsense edge",
  "gift card", "cartao presente", "assinatura", "ps plus", "psn",
]

# Se aparecer um destes, ignora sempre (mesmo dizendo "console").
termos_bloqueados = [
  "para ps5", "pra ps5", "p/ ps5", "para playstation 5", "para console", "pra console",
  "compativel com", "vr2", "psvr", "playstation vr", "playstation portal", "ps portal",
]
